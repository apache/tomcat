slowQueryReport.invalidMaxQueries=The configured maxQueries [{0}] is not a number of queries and is not applied: statistics keep being stored for at most {1} queries per pool. Correct the value in the jdbcInterceptors configuration to size the statistics store that was meant to be configured.
slowQueryReport.invalidThreshold=The configured threshold [{0}] is not a number of milliseconds and is not applied: executions slower than the current threshold of {1} milliseconds keep being reported as slow queries. Correct the value in the jdbcInterceptors configuration to report the threshold that was meant to be configured.
slowQueryReport.poolNameRequired=A connection pool configured with the slow query report interceptor must have a name: the interceptor publishes its query statistics and, for its subclass, its JMX registration under that name, so a pool that carries none has nowhere to report to. Set the name property of the pool, or leave the reporting interceptor out of the jdbcInterceptors configuration. A container-managed pool always carries a name the container generated, so this is only reached by configuring a pool of one's own with no name.
