slowQueryReport.connectionClosedOrAbandoned=A slow query report interceptor has no statistics store to book to, so the queries it reports are recorded nowhere: the connection it serves has already been closed or abandoned, or its pool carries no name to publish statistics under - statistics belong to a pool and are published under the name that pool starts with. This is reported once per interceptor instance, because the condition outlives every execution that follows it.
