slowQueryReport.unknownProperty=The interceptor property [{0}] is not recognized and is not applied: property names are matched exactly, and a name this interceptor does not know leaves the setting it was meant to configure at the value it carries. Check the jdbcInterceptors configuration for the name that was meant to be configured.

