# Message text must match how its key is fetched: text fetched through the
# argument-free MessageFactory.get(key) is handed out raw, so it must be
# written literally (a single ', braces left as they are), while text fetched
# with arguments goes through MessageFormat, which reads '' as a literal '
# and treats {n} as a placeholder.

