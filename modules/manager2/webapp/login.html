<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Log in &middot; Tomcat Manager</title>

  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/manager2.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="login-logo" aria-hidden="true">
        <img src="images/tomcat.svg" alt="">
      </span>
      <h1>Apache Tomcat</h1>
      <p class="login-sub">Manager &mdash; sign in to manage your server.</p>
    </div>
    <div class="login-error" id="login-error" hidden role="alert">
      <strong>Sign in failed.</strong> Your user name or password was incorrect.
    </div>
    <form method="post" action="j_security_check" class="login-form">
      <div class="field">
        <label for="j_username">User name</label>
        <input type="text" id="j_username" name="j_username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="j_password">Password</label>
        <input type="password" id="j_password" name="j_password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="login-foot">Use an account with the <code>manager-gui</code> role for full access or
      <code>manager-status</code> for read-only monitoring.</p>
  </main>
</body>
</html>
