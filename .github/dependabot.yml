# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  # No glob on main: modules/manager2 has no pom.xml, which would cause errors
  - package-ecosystem: "maven"
    target-branch: "main"
    directory: "/modules/stuffed"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    target-branch: "11.0.x"
    directory: "/modules/stuffed"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    target-branch: "10.1.x"
    directory: "/modules/stuffed"
    schedule:
      interval: "weekly"
  - package-ecosystem: "maven"
    target-branch: "main"
    directory: "/modules/jdbc-pool"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.apache.tomcat:tomcat-juli"
        versions: ["(,12.0.0)", "[12.1.0,)"]
  - package-ecosystem: "maven"
    target-branch: "11.0.x"
    directory: "/modules/jdbc-pool"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.apache.tomcat:tomcat-juli"
        versions: ["(,11.0.0)", "[11.1.0,)"]
  - package-ecosystem: "maven"
    target-branch: "10.1.x"
    directory: "/modules/jdbc-pool"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.apache.tomcat:tomcat-juli"
        versions: ["(,10.1.0)", "[10.2.0,)"]
  - package-ecosystem: "maven"
    target-branch: "9.0.x"
    directory: "/modules/jdbc-pool"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.apache.tomcat:tomcat-juli"
        versions: ["(,9.0.0)", "[9.1.0,)"]
  - package-ecosystem: "maven"
    target-branch: "11.0.x"
    directory: "/modules/cxf"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.apache.cxf:*"
        versions: ["(,4.2.0)", "[4.3.0,)"]
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        versions: ["(,4.1.0)", "[4.2.0,)"]
  - package-ecosystem: "maven"
    target-branch: "10.1.x"
    directory: "/modules/cxf"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.apache.cxf:*"
        versions: ["(,4.1.0)", "[4.2.0,)"]
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        versions: ["(,4.0.0)", "[4.1.0,)"]
  - package-ecosystem: "maven"
    target-branch: "9.0.x"
    directory: "/modules/cxf"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "org.apache.cxf:*"
        versions: ["(,3.6.0)", "[3.7.0,)"]
      - dependency-name: "org.apache.johnzon:johnzon-jsonb"
        versions: ["(,1.3.0)", "[2.0.0,)"]
      - dependency-name: "javax.json.bind:javax.json.bind-api"
        versions: ["(,1.0.0)", "[2.0.0,)"]
  - package-ecosystem: "maven"
    target-branch: "main"
    directory: "/modules/owb"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        versions: ["(,5.0.0)", "[5.1.0,)"]
  - package-ecosystem: "maven"
    target-branch: "11.0.x"
    directory: "/modules/owb"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        versions: ["(,4.1.0)", "[4.2.0,)"]
  - package-ecosystem: "maven"
    target-branch: "10.1.x"
    directory: "/modules/owb"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        versions: ["(,4.0.0)", "[4.1.0,)"]
  - package-ecosystem: "maven"
    target-branch: "9.0.x"
    directory: "/modules/owb"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "jakarta.enterprise:jakarta.enterprise.cdi-api"
        versions: ["(,3.0.0)", "[3.1.0,)"]
