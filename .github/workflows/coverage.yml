name: Diff Coverage

on:
  pull_request:
    branches:
      - main

# Only one run of the same workflow per branch or pull request runs at a time. A run that is still queued is
# cancelled when the workflow is triggered for a newer commit, but a run that is already in progress is left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LC_ALL: en_US.UTF-8

jobs:
  diff-coverage:
    name: targeted tests
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Determine base ref
        id: base
        run: echo "ref=origin/${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"

      - name: Select targeted tests
        id: select
        run: |
          includes="$(git diff --name-only --diff-filter=d "${{ steps.base.outputs.ref }}"...HEAD \
            | bash .github/scripts/select-tests.sh)"
          echo "includes=$includes" >> "$GITHUB_OUTPUT"
          if [ -z "$includes" ]; then
            echo "No targeted tests for the changed files; skipping coverage." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Targeted tests: \`$includes\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run targeted tests with coverage
        if: steps.select.outputs.includes != ''
        run: |
          ant -noinput deploy test-nio coverage-report \
            -Dtest.coverage=true \
            -Dtest.name="${{ steps.select.outputs.includes }}"
        env:
          ANT_OPTS: -Dtest.openssl.exists=false -Dtest.excludePerformance=true

      - name: Report diff coverage
        if: steps.select.outputs.includes != ''
        run: |
          diff-cover output/coverage/jacoco.xml \
            --compare-branch "${{ steps.base.outputs.ref }}" \
            --src-roots java \
            --format markdown:diff-cover.md
          {
            echo '## Diff coverage (targeted tests)'
            cat diff-cover.md
          } >> "$GITHUB_STEP_SUMMARY"
